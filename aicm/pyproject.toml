[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aicm"
version = "0.1.0"
description = "AI Context Manager — 规范文件扫描与上下文注入工具"
requires-python = ">=3.11"

[project.scripts]
aicm = "aicm.cli:main"

[tool.setuptools.package-data]
aicm = ["assets/*.js"]
